# ============================================================
# CI/CD Pipeline — Ticket Support MLOps
# ============================================================
#
# Workflow overview:
#   push to main  → ci → build-and-push → deploy-staging
#   push vX.X.X   → ci → deploy-production
#   pull_request  → ci (only)
#
# Required GitHub Secrets:
#   STAGING_SSH_KEY, STAGING_HOST, STAGING_USER
#   PROD_SSH_KEY, PROD_HOST, PROD_USER
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository_owner }}/tickets-api

jobs:
  # ============================================================
  # Job 1: CI — Lint, Format, Test
  # Runs on: ALL triggers (push to main, PRs, tag pushes)
  # ============================================================
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src/ tests/

      - name: Format check with black
        run: black --check src/ tests/

      - name: Run tests with pytest
        run: pytest tests/ -v
        env:
          # Unit tests mock the DB — no real connection needed
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"

  # ============================================================
  # Job 2: Build & Push Docker image to GHCR
  # Runs on: push to main only (not on PRs or tag pushes)
  # ============================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write  # Required to push to GHCR using GITHUB_TOKEN

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # Built-in token — no extra secret needed

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

  # ============================================================
  # Job 3: Deploy to Staging EC2
  # Runs on: push to main, after successful build-and-push
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Deploy to Staging EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            # Pull latest API image from GHCR
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Restart only the API container (DB continues running)
            cd ~/Ticket_Support
            docker-compose up -d --no-deps api

            # Wait for container to become healthy
            echo "Waiting for API to be healthy..."
            for i in {1..6}; do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "Health check passed on attempt $i"
                break
              fi
              echo "Attempt $i failed, waiting 10s..."
              sleep 10
              if [ $i -eq 6 ]; then
                echo "Health check FAILED after 60s"
                exit 1
              fi
            done

            echo "Staging deploy successful!"

  # ============================================================
  # Job 4: Deploy to Production EC2
  # Runs on: push of a semver tag (v1.0.0, v2.1.3, etc.)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - name: Deploy to Production EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            # Pull latest API image from GHCR
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Restart only the API container
            cd ~/Ticket_Support
            docker-compose up -d --no-deps api

            # Wait for container to become healthy
            echo "Waiting for API to be healthy..."
            for i in {1..6}; do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "Health check passed on attempt $i"
                break
              fi
              echo "Attempt $i failed, waiting 10s..."
              sleep 10
              if [ $i -eq 6 ]; then
                echo "Health check FAILED after 60s"
                exit 1
              fi
            done

            echo "Production deploy successful for tag ${{ github.ref_name }}!"
