services:
  db:
    image: postgres:15-alpine
    container_name: tickets_db
    environment:
      POSTGRES_USER: tickets_user
      POSTGRES_PASSWORD: tickets_pass
      POSTGRES_DB: tickets_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets_user -d tickets_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    container_name: tickets_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://tickets_user:tickets_pass@db:5432/tickets_db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
